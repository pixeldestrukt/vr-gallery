# The engine's demo room: five generated works, each carrying its own recipe.
# Every `process` block below is the literal input to make-art.mjs — change one, re-run, reload.
name: demo
title: Five Recipes
artist: vr-gallery demo
about: >
  A test room for the engine. Every work here was generated by examples/demo/make-art.mjs
  from a seed and a handful of parameters; the story on each one is that recipe.

room:
  size: [9, 7, 3.4]        # width, depth, height (m)
  wall: "#efece6"
  floor: "#57524d"

exhibits:
  - id: truchet
    title: Truchet, seed 11
    year: 2026
    medium: Generated SVG
    media: { image: art/truchet.svg }
    width: 0.9
    story:
      text: >
        Quarter-circle tiles, each flipped by a coin toss. No tile knows its neighbours,
        and still the arcs join into continuous paths.
      process:
        tool: make-art.mjs → truchet
        seed: 11
        params: { cells: 14, ink: "#1b1b1f", paper: "#e9e4d8" }
        made: A 1968 tile idea, rewritten in a few lines of JS.
    links:
      source: https://github.com/pixeldestrukt/vr-gallery/blob/main/examples/demo/make-art.mjs

  - id: lissajous
    title: Lissajous 5:4
    year: 2026
    medium: Generated SVG
    media: { image: art/lissajous.svg }
    width: 1.3
    story:
      text: >
        Forty passes of the same 5:4 figure, each nudged in phase and scale, fading as they go.
      process:
        tool: make-art.mjs → lissajous
        seed: 3
        params: { a: 5, b: 4, phase: 0.6, strands: 40 }

  - id: drift
    title: Drift
    year: 2026
    medium: Generated SVG
    media: { image: art/drift.svg }
    width: 1.6
    story:
      text: >
        Seventy horizontal lines displaced by summed sines. The seed only chooses four phases;
        everything else is fixed.
      process:
        tool: make-art.mjs → drift
        seed: 29
        params: { lines: 70, amp: 38 }

  - id: drift-live
    title: Drift, running
    year: 2026
    medium: Live shader
    media:
      live: { module: pieces/drift.mjs }   # unseeded: every iteration is a fresh hash
    width: 1.6
    story:
      text: >
        The same lines, moving. Each iteration draws a fresh hash, and the hash picks the
        phases and the palette. One iteration in twenty comes out inverted, the rare "night"
        variant. Click it to catch the frame you're looking at.
      process:
        tool: examples/demo/pieces/drift.mjs
        seed: a fresh hash per iteration

  - id: decay
    title: Decay
    year: 2026
    medium: Generated SVG
    media: { image: art/decay.svg }
    width: 1.1
    story:
      text: |
        An 18 × 18 grid of squares. Survival falls off down the sheet,
        and so does their order: jitter and rotation grow as they thin out.
      process:
        tool: make-art.mjs → decay
        seed: 5
        params: { grid: 18, keep: 0.62 }

  - id: moire
    title: Moiré
    year: 2026
    medium: Generated SVG
    media: { image: art/moire.svg }
    width: 1.0
    story:
      text: >
        Two sets of sixty concentric rings, 70 px apart. The seed picks the direction of the
        offset. The interference pattern isn't drawn anywhere; your eye makes it.
      process:
        tool: make-art.mjs → moire
        seed: 8
        params: { rings: 60, offset: 70 }
    provenance:
      note: The provenance slot is reserved. A token or contract reference would go here later; the viewer only displays it.
